# =====================================================================
# PhishShield Application Configuration
# =====================================================================

server.port=8080

# Spring Application Name
spring.application.name=PhishShield

# Database Configuration (MySQL 8)
# The database "phishshield_db" will be created automatically if it doesn't exist
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/phishshield_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically initialize database tables from schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging
logging.level.com.phishshield=DEBUG
logging.level.org.springframework.jdbc=INFO
